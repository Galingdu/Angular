<div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="fw-bold animate__animated animate__fadeInDown">Contact Us</h1>
      <p class="text-muted animate__animated animate__fadeInUp">We’d love to hear from you! Fill out the form or reach us through the following ways.</p>
    </div>

    <div class="row g-4">
      <!-- Contact Info -->
      <div class="col-md-4">
        <div class="card contact-card text-center p-4 animate__animated animate__zoomIn">
          <div class="contact-icon mb-3">
            <i class="bi bi-telephone-fill"></i>
          </div>
          <h5>Call Us</h5>
          <p class="text-muted">+885 234 567 890</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card contact-card text-center p-4 animate__animated animate__zoomIn animate__delay-1s">
          <div class="contact-icon mb-3">
            <i class="bi bi-envelope-fill"></i>
          </div>
          <h5>Email Us</h5>
          <p class="text-muted">support.yuthsomrang.com</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card contact-card text-center p-4 animate__animated animate__zoomIn animate__delay-2s">
          <div class="contact-icon mb-3">
            <i class="bi bi-geo-alt-fill"></i>
          </div>
          <h5>Visit Us</h5>
          <p class="text-muted">100m St, PP City, Cambodia</p>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div class="row mt-5">
      <div class="col-lg-8 mx-auto">
        <div class="card shadow p-4 contact-card animate__animated animate__fadeInUp">
          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea rows="5" class="form-control" placeholder="Type your message"></textarea>
            </div>
            <button type="submit" class="btn btn-custom px-5">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
