<div class="container my-5">
  <div class="row g-4">
    <!-- Product Cards -->
    @for(product of allProduct; track product.id) {
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="position-relative product-card p-3 bg-white shadow-sm h-100">
        <div class="discount-badge position-absolute top-0 start-0 bg-danger text-white px-2 py-1 small">
          -30%
        </div>
        <img
          src="{{ product.imageUrl }}"
          class="img-fluid d-block mx-auto"
          alt="{{ product.name }}"
          style="max-height: 200px; object-fit: contain;"
        />
        <h6 class="mt-2 fw-bold">{{ product.name }}</h6>
        <p class="mb-1 text-danger fw-bold">
          US ${{ product.price }}
          <span class="text-muted text-decoration-line-through fw-normal">
            US ${{ product.oldPrice }}
          </span>
        </p>
        <div class="d-flex align-items-center justify-content-between">
          <p class="text-muted small mb-0">{{ product.description }}</p>
          <button
            class="btn btn-warning btn-sm"
            (click)="handleAddToCart(product)"
          >
            Add to Cart
          </button>
        </div>
      </div>
    </div>
    }
  </div>

  <!-- Scrollable Drinks Section -->
  <div class="position-relative my-5">
    <!-- LEFT Button -->
    <button
      (click)="scrollLeft()"
      class="btn btn-light position-absolute start-0 top-50 translate-middle-y shadow rounded-circle"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- RIGHT Button -->
    <button
      (click)="scrollRight()"
      class="btn btn-light position-absolute end-0 top-50 translate-middle-y shadow rounded-circle"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <h2 class="fs-3 fw-bold mb-4">Best Deals For You 🔥</h2>

    <div class="overflow-auto w-100" #scrollContainer
         style="scroll-behavior: smooth; white-space: nowrap;">
      <div class="d-flex gap-3 px-2" style="min-width: 1200px;">
        <!-- Repeatable Drink Card -->
        @for(drink of drinks; track drink.id) {
        <div class="card flex-shrink-0" style="width: 200px; height: 280px;">
          <div class="ratio ratio-1x1">
            <img
              src="{{ drink.image }}"
              class="card-img-top img-fluid object-fit-contain p-2"
              style="max-height: 180px; transition: transform 0.3s;"
              onmouseover="this.style.transform='scale(1.05)'"
              onmouseout="this.style.transform='scale(1)'"
              alt="{{ drink.name }}"
            />
          </div>
          <div class="card-body p-2">
            <h6 class="fw-bold text-truncate">{{ drink.name }}</h6>
            <p class="text-danger fw-bold mb-0">
              {{ drink.price | currency }}
            </p>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
